name: Parse Decision Record from Issue

# 對應 docs/CLAUDE_INTEGRATION.md 方案 2:建 Issue → Actions 自動解析 → DB 自動更新。
#
# 安全性注意:Issue 內文是不可信輸入,絕對不能直接接進 `run:` shell 腳本字串
# (`BODY="${{ github.event.issue.body }}"` 這種寫法是典型的 GitHub Actions
# script-injection 漏洞,任何人開 Issue 都能在 runner 上跑任意指令)。
# 這裡改成用 `env:` 把內文當環境變數傳進去,再用 Python 解析、驗證是合法
# JSON 之後才寫檔案,run 步驟裡完全不會出現使用者可控的字串。

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  parse-and-save:
    if: contains(github.event.issue.labels.*.name, 'decision-record')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract and validate JSON from issue body
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          body = os.environ.get("ISSUE_BODY") or ""
          match = re.search(r"```json\s*(\{.*?\})\s*```", body, re.DOTALL)
          if not match:
              print("::error::找不到 ```json ... ``` 區塊")
              sys.exit(1)

          payload_text = match.group(1)
          try:
              payload = json.loads(payload_text)
          except json.JSONDecodeError as exc:
              print(f"::error::JSON 解析失敗: {exc}")
              sys.exit(1)

          missing = [k for k in ("market_snapshot", "trader_state", "action") if k not in payload]
          if missing:
              print(f"::error::缺少必要欄位: {', '.join(missing)}")
              sys.exit(1)

          with open("decision_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          print("解析成功")
          PY

      - name: Write decision to DB and push
        id: write
        run: |
          # trading.db 是 SQLite 二進位檔,兩個 Issue 幾乎同時開的話沒辦法用
          # git merge/rebase 處理衝突——所以每次重試都先 fetch+reset 到最新
          # origin,在「最新」的 trading.db 上重跑一次寫入,而不是對本地過期
          # 的 commit 硬 push。decision_writer.py 對重複 id 本來就會拒絕,
          # 所以就算同一個 Issue 因為某種原因觸發兩次 workflow 也是安全的。
          #
          # actions/checkout 預設是 detached HEAD,plain `git push` 在這種
          # 狀態下會直接失敗,所以一律用 `git push origin HEAD:<branch>`。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            set +e
            OUTPUT=$(python scripts/decision_writer.py --json "$(cat decision_payload.json)")
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -ne 0 ]; then
              echo "::error::寫入資料庫失敗,詳見上方輸出"
              exit 1
            fi
            echo "message=$OUTPUT" >> "$GITHUB_OUTPUT"

            git add -f trading.db
            if git diff --cached --quiet; then
              echo "trading.db 沒有變化,略過 commit"
              exit 0
            fi
            git commit -m "data: add decision from issue #${{ github.event.issue.number }}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push 失敗(可能有其他 workflow 同時在寫),重試 ${attempt}/5"
            sleep $((attempt * 3))
          done

          echo "::error::push 重試多次仍失敗"
          exit 1

      - name: Comment result on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = "${{ job.status }}" === "success"
              ? `✅ 已寫入資料庫: ${{ toJson(steps.write.outputs.message) }}`
              : "❌ 解析或寫入失敗,請檢查 Actions log 裡的錯誤訊息並修正 Issue 內文後重開一個新 Issue。";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
